on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - run: pnpm build

      - name: Install Playwright chromium browser
        run: npx playwright install --with-deps chromium

      - name: Map host.docker.internal to localhost
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Start Tika and wait for it to be ready
        run: |
          docker compose up -d tika traefik
          echo "Waiting for Tika JVM to initialize..."
          for i in {1..24}; do
            if curl -sf "http://localhost:9998/" > /dev/null 2>&1; then
              echo "Tika is ready ✅"
              break
            fi
            [ $i -eq 24 ] && echo "❌ Tika failed to start" && docker compose logs tika && exit 1
            echo "Waiting... ($i/24)"
            sleep 5
          done
      - name: Start oCIS (Tika is now ready)
        run: OCIS_IMAGE=owncloud/ocis:latest OCIS_LOG_LEVEL=info docker compose up -d ocis

      - name: Wait for oCIS
        run: |
          echo "Waiting for oCIS to become fully ready (proxy + backend services)..."
          # oCIS returns 404 until traefik has the route, then 502 while its
          # internal services register, and finally 200 once fully ready.
          # On a 2-vCPU runner the warm-up can take several minutes.
          for i in {1..60}; do
            status=$(curl -ksSo /dev/null -w "%{http_code}" \
              -u admin:admin "https://host.docker.internal:9200/ocs/v1.php/config" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "oCIS auth is ready ✅ (HTTP 200)"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ oCIS never became ready (last status: HTTP $status)"
              docker compose logs --no-color --tail=all ocis
              exit 1
            fi
            echo "Waiting for oCIS... ($i/60, HTTP $status)"
            sleep 5
          done
      - name: Run E2E tests
        id: e2e
        # chromium only, to match the upstream _e2e.yml (which runs BROWSER=chromium)
        run: npx playwright test --config=tests/e2e/ --project=chromium
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          HEADLESS: true
          CI: true
          BROWSER: chromium
          # retry flaky tests once, like the upstream _e2e.yml
          RETRY: 1
          # a11y assertions are wired into the shared action helpers and run on
          # every UI step; the upstream _e2e.yml skips them, so mirror that here.
          SKIP_A11Y_TESTS: true

      - name: Upload traces on failure
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/e2e/**/*.zip
          retention-days: 7

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: OCIS_IMAGE=owncloud/ocis:latest docker compose up -d ocis
      
      - run: pnpm install

      - run: pnpm build           

      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Wait for oCIS
        run: |
          for i in {1..30}; do
            docker compose ps
            docker compose logs --tail=10 ocis
            if curl -kfsSL "https://localhost:9200" > /dev/null 2>&1; then
              echo "oCIS is up ✅"
              break
            fi
            echo "Retrying in 5s... ($i/30)"
            sleep 5
            if [ $i -eq 30 ]; then
              echo "❌ oCIS failed to start. Full logs:"
              docker compose logs ocis
              exit 1
            fi
          done

      - name: Run E2E tests
        id: e2e
        run: pnpm test:e2e:playwright
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          HEADLESS: true
          CI: true

      - name: Upload traces on failure
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/e2e/**/*.zip
          retention-days: 7

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm build

      - name: Start Tika and wait for it to be ready
        run: |
          docker compose up -d tika traefik
          echo "Waiting for Tika JVM to initialize..."
          for i in {1..24}; do
            if curl -sf "http://localhost:9998/" > /dev/null 2>&1; then
              echo "Tika is ready ✅"
              break
            fi
            [ $i -eq 24 ] && echo "❌ Tika failed to start" && docker compose logs tika && exit 1
            echo "Waiting... ($i/24)"
            sleep 5
          done

      - name: Start oCIS (Tika is now ready)
        run:  OCIS_IMAGE=owncloud/ocis:latest docker compose up -d ocis

      - name: Wait for oCIS
        run: |
          for i in {1..30}; do
            status=$(curl -ksSo /dev/null -w "%{http_code}" "https://localhost:9200" 2>/dev/null)
            if [ "$status" != "000" ]; then
              echo "oCIS is up ✅ (HTTP $status)"
              break
            fi
            [ $i -eq 30 ] && echo "❌ oCIS failed to start" && docker compose logs ocis && exit 1
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Run E2E tests
        id: e2e
        run: pnpm test:e2e:playwright
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          HEADLESS: true
          CI: true

      - name: Upload traces on failure
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/e2e/**/*.zip
          retention-days: 7
